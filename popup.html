<!doctype html>
<html>
<head><meta charset="utf-8"><style>
body{font-family:Inter,system-ui,sans-serif;width:310px;margin:0;padding:16px;color:#141926;background:#fff}h1{font-size:18px;margin:0 0 4px}p{font-size:12px;color:#697186;line-height:1.45;margin:0 0 16px}.status{border:1px solid #e5e7ed;background:#f8f9fb;border-radius:10px;padding:11px;margin-bottom:12px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:7px}.dot.on{background:#ef4444;box-shadow:0 0 0 4px #fee2e2}button{width:100%;border:0;border-radius:9px;padding:10px 12px;font:600 13px system-ui;cursor:pointer;margin-top:8px}.primary{background:#6657f5;color:#fff}.secondary{background:#f0f2f6;color:#293042}.ghost{background:#fff;color:#555e70;border:1px solid #e2e5ec}.small{font-size:11px;color:#9299a8;margin-top:10px}
</style></head>
<body>
<h1>SkillForge Recorder</h1>
<p>Record only websites and accounts you are authorized to automate.</p>
<div class="status"><span id="dot" class="dot"></span><span id="status">Not recording</span><div id="count" class="small">0 events</div></div>
<button id="toggle" class="primary">Start recording</button>
<button id="export" class="secondary">Export recording JSON</button>
<button id="clear" class="ghost">Clear recording</button>
<script src="popup.js"></script>
</body>
</html>
